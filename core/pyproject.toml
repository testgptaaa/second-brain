[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain-core"
version = "0.1.0"
description = "Core engine for Second Brain desktop office assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "watchdog>=6.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "keyring>=25.0.0; sys_platform == 'darwin'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
